<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/styles.css?v=1.5">
  <title>Pi_Cloud - Accueil</title>
</head>
<body>
  <main class="containeurMain">
    <h1>☁️ Bienvenue sur Pi_Cloud</h1>
    <div class="containeur acceuil">
      <section>
        <p>Vous n'avez pas encore de compte ? Créez-en un gratuitement pour stocker vos fichiers en toute sécurité !</p>
        <a href="/register">
          <button><h2>✨ Créer un compte</h2></button>
        </a>
      </section>

      <section>
        <p>Vous avez déjà un compte ? Connectez-vous pour accéder à votre espace cloud sécurisé !</p>
        <a href="/login">
          <button><h2>🔑 Se connecter</h2></button>
        </a>
      </section>
    </div>
  </main>
</body>
</html>
