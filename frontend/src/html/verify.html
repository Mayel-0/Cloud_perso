<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Cloud perso || verification par mail </title>
</head>
<body>
  <main>
    <h1>Verification</h1>
    <form action="/verify" method="post" class="verify">
      <input type="hidden" name="Users_id" value="{{.}}">
      <label>Verification code :</label>
      <input type="text" name="code" id="code" required/>
      <button type="submit">Verification</button>
    </form>
  </main>
</body>
</html>
