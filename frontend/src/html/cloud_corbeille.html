<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/styles.css?v=1.5">
  <title>Pi_Cloud - Corbeille</title>
</head>
<body>
  <div class="page-header">
    <h1>🗑️ Corbeille</h1>
  </div>

  <div class="trash-container">

    {{range .Folders}}
      <div class="trash-item">
        <div>
          <h1>📁 {{.Nom}}</h1>
        </div>
        <div class="trash-item-actions">
          <form action="/restorfolder" method="post">
            <input type="hidden" name="folder_id" value="{{.Id}}">
            <button type="submit" class="btn-primary">♻️ Restaurer</button>
          </form>
          <form action="/harddeleteFolder" method="post">
            <input type="hidden" name="folder_id" value="{{.Id}}">
            <button type="submit" class="btn-danger">❌ Supprimer définitivement</button>
          </form>
        </div>
      </div>
    {{end}}

    {{range .Files}}
      <div class="trash-item">
        <div>
          <h1>📄 {{.OriginalName}}</h1>
        </div>
        <div class="trash-item-actions">
          <form action="/restorfile" method="post">
            <input type="hidden" name="file_id" value="{{.ID}}">
            <button type="submit" class="btn-primary">♻️ Restaurer</button>
          </form>
          <form action="/harddeletefile" method="post">
            <input type="hidden" name="file_id" value="{{.ID}}">
            <button type="submit" class="btn-danger">❌ Supprimer définitivement</button>
          </form>
        </div>
      </div>
    {{end}}
  </div>

  <div class="action-bar">
    <a href="/harddeleteall">
      <button class="btn-danger">🗑️ Vider la corbeille</button>
    </a>
    <a href="/cloud/acceuil/">
      <button class="btn-secondary">☁️ Retour au Cloud</button>
    </a>
  </div>
</body>
</html>
