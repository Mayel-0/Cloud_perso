<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/styles.css?v=1.5">
  <title>Pi_Cloud - Inscription</title>
</head>
<body>
  <main class="containeurRegister">
    <h1>✨ Créer votre compte</h1>
    <form method="post" action="/register" class="register">
      <label for="name">Nom d'utilisateur</label>
      <input type="text" name="name" id="name" placeholder="Votre nom" required>

      <label for="email">Adresse email</label>
      <input type="email" name="email" id="email" placeholder="votre@email.com" required>

      <label for="password">Mot de passe</label>
      <input type="password" name="password" id="password" placeholder="Minimum 8 caractères" required>

      <label for="passwordV">Confirmation du mot de passe</label>
      <input type="password" name="passwordV" id="passwordV" placeholder="Confirmez votre mot de passe" required>

      <button type="submit">Créer mon compte</button>

      {{if .CodeVerify}}
        <p class="ErrorMsg">{{.CodeVerify}}</p>
      {{end}}

      <p style="text-align: center; margin-top: 20px;">
        Déjà un compte ? <a href="/login" style="color: var(--AccentColor); font-weight: 600;">Se connecter</a>
      </p>
    </form>
  </main>
</body>
</html>
